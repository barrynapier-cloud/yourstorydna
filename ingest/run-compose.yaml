# One-shot ingest job for the VPS (Hostinger Docker project "library-ingest").
# Reads the DB password from the library-db project's env file, so no secret lives here.
services:
  ingest:
    image: python:3.12-slim
    restart: "no"
    env_file: /docker/library-db/.env
    environment:
      BRANCH: claude/project-thread-0eyndp
      STEPS: genes,core,catalog,desc,export
      CAT_LIMIT: "300"
      DESC_LIMIT: "2500"
    networks: [db]
    volumes:
      - site:/out
    command: ["sh","-c","pip install -q 'psycopg[binary]' && mkdir -p /app && cd /app && for f in ingest.py core.txt genes_sf.json proto_map.json subject_map.json axis_map.json kimi_sf.json; do python -c \"import urllib.request,sys;urllib.request.urlretrieve('https://raw.githubusercontent.com/barrynapier-cloud/yourstorydna/'+sys.argv[1]+'/ingest/'+sys.argv[2],sys.argv[2])\" \"$$BRANCH\" $$f || exit 1; done && python -u ingest.py"]
networks:
  db:
    name: library-db_default
    external: true
volumes:
  site:
    name: library_site
    external: true
